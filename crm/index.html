<title>Masjid Al Momineen CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@400;500;600;700&family=Marcellus&display=swap">
<style>
/* Layout: fixed left rail of sections (top tab strip on phones) beside one working pane; records open in a side sheet. */
:root{
  --bg:#f4f5f1; --surface:#ffffff; --sunk:#eceee8; --ink:#17231f; --muted:#5b6964; --line:#dce1db;
  --accent:#0f5c4f; --accent-ink:#ffffff; --accent-soft:#e2ede9; --brass:#94702b; --brass-soft:#f4ecdb;
  --good:#2b7a4b; --warn:#9a5f0c; --crit:#ad3529; --crit-soft:#f8e6e3; --warn-soft:#f7ecd9;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 8px 24px rgba(20,40,35,.08);
  --f-display:"Marcellus","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-arabic:"Amiri","Geeza Pro","Traditional Arabic",serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1614; --surface:#15201d; --sunk:#1b2825; --ink:#e4ebe8; --muted:#94a49e; --line:#273531;
  --accent:#55b9a2; --accent-ink:#04201a; --accent-soft:#18332d; --brass:#d4ad60; --brass-soft:#2d2717;
  --good:#62c38a; --warn:#e3ad52; --crit:#f17f71; --crit-soft:#3a1f1c; --warn-soft:#352914;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#15201d; --sunk:#1b2825; --ink:#e4ebe8; --muted:#94a49e; --line:#273531;
  --accent:#55b9a2; --accent-ink:#04201a; --accent-soft:#18332d; --brass:#d4ad60; --brass-soft:#2d2717;
  --good:#62c38a; --warn:#e3ad52; --crit:#f17f71; --crit-soft:#3a1f1c; --warn-soft:#352914;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand .ar{font-family:var(--f-arabic);font-size:22px;color:var(--brass);line-height:1.2;direction:rtl;text-align:left}
.brand .en{font-family:var(--f-display);font-size:19px;line-height:1.2}
.brand .sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
nav.tabs a:hover{background:var(--sunk);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs .n{font-size:12px;color:var(--muted);font-weight:500}
.rail-foot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.live{background:var(--good)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}
/* main */
main{min-width:0;padding-block:26px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.head h1{font-size:30px;line-height:1.1}
.head .date{color:var(--muted);font-size:13px;margin-top:4px}
.head .date .hj{color:var(--brass)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:transparent;background:transparent}
.btn.danger.armed{background:var(--crit);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--brass-soft);color:var(--ink);margin-bottom:18px;font-size:13px}
.banner.crit{background:var(--crit-soft)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:28px;line-height:1.15}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h2{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h2 a,.panel h2 .aside{font-family:var(--f-body);font-size:12px;color:var(--accent);text-decoration:none;font-weight:500}
.panel h2 .aside{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar{fill:var(--accent)}
.chart .bar.cur{fill:var(--brass)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+.bar,.chart g:hover .bar{opacity:.8}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:var(--shadow)}
.funds{display:flex;flex-direction:column;gap:9px}
.fund{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13px}
.fund .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.fund .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.fund .amt{font-weight:600;min-width:64px;text-align:right}
/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted)}
.row .r{text-align:right;font-weight:600;white-space:nowrap}
.cal{width:44px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;line-height:1.1}
.cal .mo{background:var(--accent);color:var(--accent-ink);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 0;font-weight:600}
.cal .d{font-family:var(--f-display);font-size:18px;padding:3px 0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.brass{background:var(--brass-soft);color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
/* toolbar + table */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.field,.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.sum{margin-left:auto;color:var(--muted);font-size:13px}
.sum b{color:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:right;white-space:nowrap}
td .sub{display:block;font-size:12px;color:var(--muted)}
tfoot td{font-weight:600;background:var(--sunk);border-top:1px solid var(--line)}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.prog.done i{background:var(--good)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.done-t{text-decoration:line-through;color:var(--muted)}
/* empty hero */
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:grid;gap:14px;max-width:720px}
.welcome h2{font-size:24px}
.welcome p{margin:0;color:var(--muted);max-width:62ch}
.welcome ol{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:4px}
/* dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(8,20,17,.45)}
dialog.sheet{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(520px,100vw);border-radius:14px 0 0 14px}
.dlg{display:flex;flex-direction:column;max-height:inherit;height:100%}
.dlg header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line);padding-top:max(18px,env(safe-area-inset-top,0px))}
.dlg header h2{font-size:22px}
.dlg .body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.dlg footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.dlg footer .left{margin-right:auto}
.x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.form label .hint{font-weight:400}
.form .field{width:100%;color:var(--ink);font-weight:400;font-size:14px}
.form textarea.field{min-height:72px;resize:vertical}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;background:var(--surface);font-weight:500;color:var(--muted)}
.pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.err{color:var(--crit);font-size:13px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:8px;padding:10px 12px}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stat .v{font-family:var(--f-display);font-size:20px}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere;user-select:text}
.sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
pre.stmt{margin:0;padding:14px;background:var(--sunk);border-radius:8px;font-size:12px;white-space:pre-wrap;overflow-x:auto;user-select:all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.toast{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);z-index:50}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand{flex-direction:row;align-items:baseline;gap:10px;padding:0}
  .brand .sub,.rail-foot{display:none}
  nav.tabs{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:8px;scrollbar-width:none}
  nav.tabs a{flex:none;padding:7px 11px}
  nav.tabs .n{display:none}
  main{padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .head h1{font-size:24px}
  .form{grid-template-columns:minmax(0,1fr)}
  .kpi .v{font-size:22px}
  dialog.sheet{border-radius:0}
}
@media (prefers-reduced-motion:no-preference){.btn,nav.tabs a{transition:background .15s,border-color .15s,color .15s}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="ar" lang="ar">مسجد المؤمنين</span>
      <span class="en">Masjid Al Momineen</span>
      <span class="sub">Community CRM</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="rail-foot">
      <div id="conn"><span class="dot"></span>Connecting…</div>
      <div id="rolenote"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<dialog id="sheet" class="sheet"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
/* ---------- constants ---------- */
const MASJID = "Masjid Al Momineen";
const CURRENCY = "USD";
const COLS = ["members","donations","pledges","events","followups"];
const FUNDS = ["General Fund","Zakat","Sadaqah","Zakat al-Fitr","Building Fund","Ramadan Iftar","Education","Janazah Fund"];
const METHODS = ["Cash","Check","Card","Bank transfer","Online"];
const ROLES = ["Volunteer","Board","Teacher","Staff","Youth","New Muslim"];
const STATUSES = ["Active","Inactive","Visitor"];
const EVENT_CATS = ["Jumu'ah","Halaqa","Qur'an class","Youth","Sisters","Eid","Iftar","Fundraiser","Janazah","Community"];
const FU_TYPES = ["Phone call","Home visit","Hospital visit","Welcome","Condolence","Pledge reminder","Other"];
const VIEWS = [
  ["dashboard","Overview"],["members","Members"],["donations","Donations"],
  ["pledges","Pledges"],["events","Events"],["followups","Follow-ups"]
];
const LS_KEY = "mam-crm-v1";

/* ---------- state ---------- */
const S = {members:[],donations:[],pledges:[],events:[],followups:[]};
let store = null;           // adapter
let conn = "connecting";    // connecting | loading | live | slow | local | error
let readOnly = false;
let downloads = null;
let view = "dashboard";
let builtView = null;
const ui = {mq:"", mstatus:"Active", mrole:"", dq:"", dfund:"", dyear:String(new Date().getFullYear()), fstatus:"Open", ewhen:"upcoming"};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const parseD = s => { if(!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d||1); };
const money0 = new Intl.NumberFormat("en-US",{style:"currency",currency:CURRENCY,maximumFractionDigits:0});
const money2 = new Intl.NumberFormat("en-US",{style:"currency",currency:CURRENCY,minimumFractionDigits:2,maximumFractionDigits:2});
const m0 = n => money0.format(n||0), m2 = n => money2.format(n||0);
const fmtDate = s => { const d = parseD(s); return d ? d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "—"; };
let hijriFmt = null;
try { hijriFmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}); } catch(e) {}
const hijri = d => { try { return hijriFmt ? hijriFmt.format(d).replace(/ AH$/,"") + " AH" : ""; } catch(e){ return ""; } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const byId = (col,id) => S[col].find(r => r.id === id);
const memberName = id => { const m = id && byId("members",id); return m ? m.name : ""; };
const donorLabel = d => memberName(d.memberId) || d.donorName || "Anonymous";
const sumAmt = arr => arr.reduce((a,r) => a + (Number(r.amount)||0), 0);
const year = () => new Date().getFullYear();
const sampleChip = r => r.sample ? ' <span class="chip brass">Sample</span>' : "";

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function errMsg(e){
  const c = e && e.code;
  if (c === "invalid_argument") return "You don't have permission to change records here. Ask the owner for Contributor access.";
  if (c === "quota_exceeded") return "The database is full. Delete old records to make room.";
  if (c === "resource_exhausted") return "Too many changes at once. Wait a moment and try again.";
  return "Couldn't save. Check your connection and try again.";
}

/* ---------- storage adapters ---------- */
function localAdapter(){
  try { const d = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); COLS.forEach(c => S[c] = Array.isArray(d[c]) ? d[c] : []); } catch(e) {}
  const persist = () => { try { const o = {}; COLS.forEach(c => o[c] = S[c]); localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch(e) {} };
  return {
    async add(c,d){ S[c] = [...S[c], {...d, id: uid()}]; persist(); render(); },
    async set(c,id,d){ S[c] = S[c].map(r => r.id === id ? {...d, id} : r); persist(); render(); },
    async remove(c,id){ S[c] = S[c].filter(r => r.id !== id); persist(); render(); }
  };
}
function dbAdapter(db){
  return {
    add: (c,d) => db.collection(c).add(d),
    set: (c,id,d) => db.collection(c).doc(id).set(d),
    remove: (c,id) => db.collection(c).doc(id).delete()
  };
}
const strip = r => { const o = {...r}; delete o.id; return o; };

async function boot(){
  render();
  let db = null;
  if (window.claude && typeof window.claude.use === "function") {
    try { db = await window.claude.use("db"); } catch(e) { db = null; }
  }
  if (!db) { store = localAdapter(); conn = "local"; render(); return; }
  store = dbAdapter(db);
  conn = "loading"; render();
  const pending = new Set(COLS);
  const timer = setTimeout(() => { if (conn === "loading") { conn = "slow"; render(); } }, 10000);
  COLS.forEach(c => db.collection(c).onSnapshot(snap => {
    S[c] = snap.docs.map(d => ({...d.data(), id: d.id}));
    if (!snap.metadata.fromCache) { pending.delete(c); if (!pending.size) { conn = "live"; clearTimeout(timer); } }
    queueRender();
  }, () => { conn = "error"; clearTimeout(timer); render(); }));
  try {
    const user = await window.claude.use("user");
    if (user) { const can = await user.can("data.write"); if (can === false) { readOnly = true; render(); } }
  } catch(e) {}
  try { downloads = await window.claude.use("downloads"); } catch(e) {}
}

let rq = 0;
function queueRender(){ if (!rq) rq = requestAnimationFrame(() => { rq = 0; render(); }); }

async function write(fn){
  if (readOnly) { toast("You have view-only access."); return false; }
  if (!store) { toast("Still connecting. Try again in a moment."); return false; }
  try { await fn(); return true; }
  catch(e){ if (e && e.code === "invalid_argument") { readOnly = true; render(); } toast(errMsg(e)); return false; }
}

/* ---------- derived data ---------- */
function memberStats(id){
  const ds = S.donations.filter(d => d.memberId === id);
  const y = String(year());
  const ytd = sumAmt(ds.filter(d => (d.date||"").startsWith(y)));
  const last = ds.slice().sort((a,b) => (b.date||"").localeCompare(a.date||""))[0];
  return {ds, ytd, all: sumAmt(ds), last};
}
function pledgePaid(p){
  return sumAmt(S.donations.filter(d => d.memberId === p.memberId && d.fund === p.campaign &&
    (!p.startDate || (d.date||"") >= p.startDate) && (!p.endDate || (d.date||"") <= p.endDate)));
}
function monthly12(){
  const now = new Date(), out = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    out.push({key, label: d.toLocaleDateString("en-US",{month:"short"}), full: d.toLocaleDateString("en-US",{month:"long",year:"numeric"}),
      v: sumAmt(S.donations.filter(x => (x.date||"").startsWith(key))), cur: i === 0});
  }
  return out;
}

    slow:["warn","Can't reach the database yet"], local:["warn","Saved in this browser only"], error:["crit","Connection lost — reload"]}[conn];

/* ---------- views ---------- */
function render(){
  const h = (location.hash || "").slice(1);
  view = VIEWS.some(v => v[0] === h) ? h : "dashboard";
  renderChrome();

  if (!keepToolbar) { main.innerHTML = VIEW_FN[view].shell(); builtView = view; }
  VIEW_FN[view].fill();
  if (openSheetId) renderSheet();
}

/* ---------- chart ---------- */
function chart(){
  const data = monthly12(), W = 560, H = 190, L = 44, B = 22, T = 10;
  const max = Math.max(...data.map(d => d.v));
  const step = niceStep(max/3), top = Math.max(step*3, step*Math.ceil(max/step));
  const y = v => T + (H-T-B) * (1 - v/top), bw = (W-L)/12;
  let g = "";
  for (let v = 0; v <= top + 0.001; v += step) g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;
  const bars = data.map((d,i) => { const x = L + i*bw + bw*0.2, w = bw*0.6, h = (H-T-B) - (y(d.v)-T), yy = y(d.v);
    const path = h > 0 ? `M${x},${H-B} V${yy+Math.min(4,h)} Q${x},${yy} ${x+Math.min(4,h)},${yy} H${x+w-Math.min(4,h)} Q${x+w},${yy} ${x+w},${yy+Math.min(4,h)} V${H-B} Z` : "";
    return `<g data-tip="${esc(d.full)}: ${esc(m0(d.v))}"><rect class="hit" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T}"/>${path ? `<path class="bar ${d.cur?"cur":""}" d="${path}"/>` : ""}<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${d.label}</text></g>`; }).join("");
  return `<div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly giving for the last 12 months">${g}${bars}</svg><div class="tip" id="tip" hidden></div></div>
    <p class="empty" style="padding-bottom:0">Current month in gold. Hover a month for its total.</p>`;
}
function niceStep(v){ if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function short(v){ return v >= 1000 ? "$" + (v/1000).toFixed(v % 1000 ? 1 : 0) + "k" : "$" + v; }
function wireChart(){
  const c = $("#chart"); if (!c) return; const tip = $("#tip");
  c.querySelectorAll("g[data-tip]").forEach(g => {
    g.addEventListener("pointerenter", () => { const r = g.getBoundingClientRect(), cr = c.getBoundingClientRect(); tip.textContent = g.dataset.tip; tip.style.left = (r.left - cr.left + r.width/2) + "px"; tip.style.top = (r.top - cr.top + 30) + "px"; tip.hidden = false; });
    g.addEventListener("pointerleave", () => tip.hidden = true);
  });
}

function openForm(col, id, preset){
  const spec = FORMS[col], rec = id ? byId(col,id) : null;
  const val = f => rec ? rec[f.k] : preset && preset[f.k] != null ? preset[f.k] : typeof f.def === "function" ? f.def() : f.def;
  const fieldHtml = f => {
    const v = val(f), fid = `f-${col}-${f.k}`, lab = `${esc(f.l)}${f.hint ? ` <span class="hint">· ${esc(f.hint)}</span>` : ""}`;
    let input;
    if (f.type === "select") input = `<select class="field" id="${fid}" name="${f.k}">${f.opts.map(o => `<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    else if (f.type === "member") input = `<select class="field" id="${fid}" name="${f.k}" ${f.req?"required":""}>${memberOpts(v, f.none)}</select>`;
    else if (f.type === "textarea") input = `<textarea class="field" id="${fid}" name="${f.k}">${esc(v)}</textarea>`;
    else if (f.type === "picks") return `<div class="full"><label style="margin-bottom:6px">${lab}</label><div class="pickrow" data-picks="${f.k}">${f.opts.map(o => `<button type="button" class="pick" aria-pressed="${(v||[]).includes(o)}" data-val="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`;
    else input = `<input class="field" id="${fid}" name="${f.k}" type="${f.type||"text"}" ${f.type==="number"?'min="0" step="any" inputmode="decimal"':""} value="${esc(v)}" ${f.req?"required":""}>`;
    return `<label class="${f.full?"full":""}" for="${fid}">${lab}${input}</label>`;
  };
  const d = $("#dlg");
  d.innerHTML = `<form class="dlg" id="form" novalidate>
    <header><h2>${rec ? "Edit" : "New"} ${spec.title}</h2><button type="button" class="x" data-act="close" aria-label="Close">×</button></header>
    <div class="body"><div class="form">${spec.fields.map(fieldHtml).join("")}</div><div class="err" id="ferr" hidden></div></div>
    <footer>${rec ? `<button type="button" class="btn danger left" data-act="delete" data-col="${col}" data-id="${esc(id)}" ${readOnly?"disabled":""}>Delete</button>` : ""}
      <button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary" ${readOnly?"disabled":""}>${rec ? "Save changes" : "Add " + spec.title}</button></footer></form>`;
  showDlg(d);
  d.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true")));
  $("#form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target), out = {}, err = $("#ferr");
    for (const f of spec.fields) {
      if (f.type === "picks") { out[f.k] = [...d.querySelectorAll(`[data-picks="${f.k}"] .pick[aria-pressed="true"]`)].map(b => b.dataset.val); continue; }
      let v = (fd.get(f.k) ?? "").toString().trim();
      if (f.req && !v) { err.textContent = `${f.l} is required.`; err.hidden = false; return; }
      if (f.type === "number") { if (v === "") { out[f.k] = null; continue; } const n = Number(v); if (!isFinite(n) || n < 0) { err.textContent = `${f.l} must be a positive number.`; err.hidden = false; return; } out[f.k] = Math.round(n*100)/100; continue; }
      out[f.k] = v;
    }
    if (col === "donations" && !out.amount) { err.textContent = "Amount must be more than zero."; err.hidden = false; return; }
    if (col === "pledges" && out.endDate && out.startDate && out.endDate < out.startDate) { err.textContent = "The end date is before the start date."; err.hidden = false; return; }
    const body = rec ? {...strip(rec), ...out, updatedAt: Date.now()} : {...out, createdAt: Date.now()};
    const ok = await write(() => rec ? store.set(col, id, body) : store.add(col, body));
    if (ok) { closeDlg(d); toast(rec ? "Changes saved" : `${spec.title[0].toUpperCase() + spec.title.slice(1)} added`); }
  });
  setTimeout(() => { const first = d.querySelector(".field"); if (first && !rec) first.focus(); }, 30);
}

/* ---------- giving statement ---------- */
function statementText(m, y){
  const ds = S.donations.filter(d => d.memberId === m.id && (d.date||"").startsWith(String(y))).sort((a,b) => (a.date||"").localeCompare(b.date||""));
  const lines = [
    `${MASJID}`, `Statement of Contributions — ${y}`, ``,
    `Donor:   ${m.name}`, m.household ? `Household: ${m.household}` : null, m.address ? `Address: ${m.address}` : null, ``,
    `Date          Fund              Method          Amount`,
    `------------  ----------------  ------------  ----------`,
    ...ds.map(d => `${fmtDate(d.date).padEnd(12)}  ${(d.fund||"").padEnd(16).slice(0,16)}  ${(d.method||"").padEnd(12).slice(0,12)}  ${m2(d.amount).padStart(10)}`),
    ds.length ? `` : `No contributions recorded for ${y}.`,
    `Total contributions in ${y}: ${m2(sumAmt(ds))}`, ``,
    `No goods or services were provided in exchange for these contributions.`,
    `JazakAllahu khayran for your support of ${MASJID}.`
  ];
  return lines.filter(l => l !== null).join("\n");
}
function openStatement(id, y){
  const m = byId("members", id); if (!m) return; y = y || year();
  const years = [...new Set([year(), ...S.donations.filter(d => d.memberId === id).map(d => Number((d.date||"").slice(0,4))).filter(Boolean)])].sort((a,b) => b-a);
  const d = $("#dlg"), txt = statementText(m, y);
  d.innerHTML = `<div class="dlg"><header><h2>Giving statement</h2><button type="button" class="x" data-act="close" aria-label="Close">×</button></header>
    <div class="body"><label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)">Year <select class="field" id="stmt-year" style="width:auto">${years.map(x => `<option ${x===y?"selected":""}>${x}</option>`).join("")}</select></label>
    <pre class="stmt" id="stmt">${esc(txt)}</pre></div>
    <footer><button class="btn" data-act="dl-stmt" data-id="${esc(id)}" data-year="${y}">Download .txt</button><button class="btn primary" data-act="copy-stmt">Copy text</button></footer></div>`;
  showDlg(d);
  $("#stmt-year").addEventListener("change", e => openStatement(id, Number(e.target.value)));
}

function csv(rows){ return rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }).join(",")).join("\n"); }
async function saveFile(filename, data){
  if (downloads) { try { await downloads.save({filename, data}); toast("File ready"); } catch(e) { if (e && e.code !== "declined") toast("Couldn't save the file."); } return; }
  if (conn === "local") { try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data],{type:"text/plain"})); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return; } catch(e) {} }
  toast("Downloads aren't available here. Use Copy instead.");
}
function exportMembers(){
  const rows = [["Name","Household","Status","Phone","Email","Address","Member since","Roles",`Given ${year()}`,"Given all time","Notes"],

}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-open],[data-edit]");
  if (!t) return;
  if (t.dataset.open) { e.preventDefault(); openSheet(t.dataset.open); return; }
  if (t.dataset.edit && !t.dataset.act) { if (t.closest("#sheet") && $("#dlg").open) return; openForm(t.dataset.edit, t.dataset.id); return; }
  const a = t.dataset.act, dlg = t.closest("dialog");
  if (a === "close") { closeDlg(dlg); if (dlg && dlg.id === "sheet") openSheetId = null; }
  else if (a === "new") openForm(t.dataset.col, null, t.dataset.member ? {memberId: t.dataset.member} : null);
  else if (a === "edit-member") openForm("members", t.dataset.id);
  else if (a === "delete") {
    if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Click again to delete"; setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); t.textContent = "Delete"; } }, 4000); return; }
    const ok = await write(() => store.remove(t.dataset.col, t.dataset.id));
    if (ok) { closeDlg($("#dlg")); toast("Deleted"); }
  }
  else if (a === "toggle-fu") {
    const f = byId("followups", t.dataset.id); if (!f) return;
    await write(() => store.set("followups", f.id, {...strip(f), status: f.status === "Done" ? "Open" : "Done", updatedAt: Date.now()}));
  }
  else if (a === "statement") openStatement(t.dataset.id);
  else if (a === "copy-stmt") { const txt = $("#stmt").textContent; try { await navigator.clipboard.writeText(txt); toast("Copied"); } catch(err) { const r = document.createRange(); r.selectNodeContents($("#stmt")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected — press Ctrl/Cmd+C to copy"); } }
  else if (a === "dl-stmt") { const m = byId("members", t.dataset.id); if (m) saveFile(`giving-statement-${t.dataset.year}-${(m.name||"donor").replace(/\W+/g,"-").toLowerCase()}.txt`, statementText(m, Number(t.dataset.year))); }
  else if (a === "csv-members") exportMembers();
  else if (a === "csv-donations") exportDonations();
  else if (a === "sample") loadSample();
  else if (a === "clear-sample") clearSample();
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-open],tr[data-edit]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (["mq","dq"].includes(id)) { ui[id] = e.target.value; VIEW_FN[view].fill(); }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if (["mstatus","mrole","dfund","dyear","fstatus","ewhen"].includes(id)) { ui[id] = e.target.value; VIEW_FN[view].fill(); }
});
$("#sheet").addEventListener("close", () => { openSheetId = null; });
window.addEventListener("hashchange", () => { window.scrollTo(0,0); render(); });

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
